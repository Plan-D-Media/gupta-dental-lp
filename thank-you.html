<script>
/* ------------------------------------------------------------
   Read the query string ONCE, whitelist every value, and hand the
   result to js/thank-you.js as window.__TY. Nothing downstream
   touches location.search, so nothing from the URL can reach the
   page as markup.

   The treatment parameter is "t" — the same key index.html sends.
   The keys below mirror js/config.js -> treatments[].key.
   ------------------------------------------------------------ */
window.dataLayer = window.dataLayer || [];
(function () {
  var CLINICS = ["phoolbagan", "seventanks"];
  var TREATMENTS = ["root-canal", "crown", "scaling", "filling", "implant", "whitening",
                    "toothache", "laser-gum", "broken", "braces", "dentures", "child",
                    "checkup", "unsure"];
  var OFFERS = ["discount-15"];

  var p = new URLSearchParams(window.location.search);
  var pick = function (name, allowed) {
    var v = (p.get(name) || "").trim().toLowerCase();
    return allowed.indexOf(v) > -1 ? v : "";
  };

  window.__TY = {
    clinic:    pick("clinic", CLINICS),
    treatment: pick("t", TREATMENTS),
    offer:     pick("offer", OFFERS)
  };
})();
</script>

<script src="js/config.js" defer></script>
<script src="js/thank-you.js" defer></script>

<script>
/* Google Tag Manager — written only when a container ID is set in js/config.js.
   THIS IS THE GOOGLE ADS CONVERSION PAGE.
   Deferred so it runs after config.js has loaded, and blocks no paint. */
document.addEventListener("DOMContentLoaded", function () {
  var id = (window.GD_CONFIG && window.GD_CONFIG.gtmId || "").trim();
  if (!id) return;
  window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
  var f = document.getElementsByTagName("script")[0],
      j = document.createElement("script");
  j.async = true;
  j.src = "https://www.googletagmanager.com/gtm.js?id=" + encodeURIComponent(id);
  f.parentNode.insertBefore(j, f);
});
</script>
