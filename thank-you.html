<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Gupta Dental</title>
<meta name="description" content="Your appointment request has reached Gupta Dental. We will call you back shortly.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0B3B39">
<link rel="icon" href="assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;600&display=swap&subset=latin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;600&display=swap&subset=latin" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;600&display=swap&subset=latin"></noscript>
<link rel="stylesheet" href="css/styles.css">

<script>window.dataLayer = window.dataLayer || [];</script>
<script src="js/config.js" defer></script>
<script>
/* Google Tag Manager — written only when a container ID is set in js/config.js.
   THIS IS THE GOOGLE ADS CONVERSION PAGE.
   Deferred so it runs after config.js has loaded, and blocks no paint. */
document.addEventListener("DOMContentLoaded", function () {
  var id = (window.GD_CONFIG && window.GD_CONFIG.gtmId || "").trim();
  if (!id) return;
  window.dataLayer.push({'gtm.start': new Date().getTime(), event: 'gtm.js'});
  var f = document.getElementsByTagName('script')[0],
      j = document.createElement('script');
  j.async = true;
  j.src = 'https://www.googletagmanager.com/gtm.js?id=' + encodeURIComponent(id);
  f.parentNode.insertBefore(j, f);
});
</script>
</head>

<body>

<!-- GTM <body> fallback. Only has any effect with JavaScript off.
     After setting gtmId in js/config.js, uncomment and paste the same ID here:

<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-XXXXXXX"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
-->

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></symbol>
  <symbol id="i-wa" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.4 2 11.9c0 1.9.5 3.7 1.5 5.3L2 22l4.9-1.4c1.5.9 3.3 1.3 5.1 1.3 5.5 0 10-4.4 10-9.9S17.5 2 12 2zm5 13.9c-.2.6-1.2 1.2-1.7 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4-.1.7.5l.9 2.2c.1.2.1.3 0 .5l-.4.5-.3.3c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.4.3.1.4.1.6-.1l.9-1c.2-.2.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.6-.1 1.1z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M9.6 16.6 5 12l1.4-1.4 3.2 3.2 8-8L19 7.2z"/></symbol>
</svg>

<header class="site-header">
  <div class="container header-inner">
    <div class="logo">
      <picture>
        <source srcset="assets/img/logo.webp" type="image/webp">
        <img src="assets/img/logo.png" width="280" height="172" alt="Gupta Dental" decoding="async">
      </picture>
    </div>
  </div>
</header>

<main class="ty-wrap">
  <div class="container">
    <div class="ty-card">

      <span class="tick-circle" aria-hidden="true">
        <svg><use href="#i-check"></use></svg>
      </span>

      <h1>Thank you, we will call you back shortly</h1>

      <p class="lede" id="ty-sub">
        Your request has reached the clinic. We call back within 30 minutes during clinic hours.
      </p>

      <div class="ty-detail" id="ty-detail" hidden>
        <p id="ty-clinic-line" style="margin:0 0 6px"></p>
        <p id="ty-treatment-line" style="margin:0"></p>
      </div>

      <div class="ty-actions">
        <a href="#" class="btn btn-primary" id="ty-call" data-loc="thank_you">
          <svg class="ico" aria-hidden="true"><use href="#i-phone"></use></svg>
          <span id="ty-call-label">Call the clinic</span>
        </a>
        <a href="#" class="btn btn-whatsapp" id="ty-wa" data-loc="thank_you" target="_blank" rel="noopener">
          <svg class="ico" aria-hidden="true"><use href="#i-wa"></use></svg>Chat on WhatsApp
        </a>
      </div>

      <a class="ty-back" href="index.html">Back to the offer page</a>

    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-legal" style="margin-top:0;border-top:0;padding-top:0">
      <p>Your details are used only to contact you about your appointment.</p>
      <p id="ty-copy">© 2026 Gupta Dental</p>
    </div>
  </div>
</footer>

<script>
/* config.js is deferred, so wait for it before reading GD_CONFIG. */
document.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var CFG = window.GD_CONFIG;
  if (!CFG) return;

  var $ = function (s) { return document.querySelector(s); };
  var params = new URLSearchParams(window.location.search);
  var key = params.get("clinic") || "";
  var treatment = (params.get("treatment") || params.get("t") || "").trim();

  var clinics = CFG.clinics || {};
  var c = clinics[key] || null;

  var offer = CFG.offer || {};
  var expired = !offer.expiry || new Date().toISOString().slice(0, 10) > String(offer.expiry);

  function track(name, p) {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(Object.assign({ event: name }, p || {}));
  }

  /* detail block */
  var detail = $("#ty-detail");
  if (c || treatment) {
    detail.hidden = false;
    $("#ty-clinic-line").innerHTML = c
      ? "Clinic: <strong>" + (c.name || c.shortName) + "</strong>"
      : "";
    $("#ty-treatment-line").innerHTML = treatment
      ? "You asked about: <strong>" + treatment.replace(/[<>&]/g, "") + "</strong>"
      : "";
  }

  /* call + WhatsApp for the clinic they chose */
  var callBtn = $("#ty-call"), waBtn = $("#ty-wa");

  if (c) {
    callBtn.href = "tel:" + c.tel;
    $("#ty-call-label").textContent = "Call " + (c.shortName || c.name) + " · " + c.phoneDisplay;

    var msg = "Hi, I have just booked an appointment at " + (c.shortName || c.name);
    if (!expired) msg += " with the " + offer.percent + "% off offer.";
    else msg += ".";
    if (treatment) msg += " " + treatment;
    waBtn.href = c.whatsapp ? "https://wa.me/" + c.whatsapp + "?text=" + encodeURIComponent(msg) : "#";
    if (!c.whatsapp) waBtn.hidden = true;
  } else {
    /* no clinic in the URL — fall back to the first one in config */
    var firstKey = Object.keys(clinics)[0];
    var f = clinics[firstKey];
    if (f) {
      callBtn.href = "tel:" + f.tel;
      $("#ty-call-label").textContent = "Call " + (f.shortName || f.name) + " · " + f.phoneDisplay;
      waBtn.href = f.whatsapp ? "https://wa.me/" + f.whatsapp : "#";
      key = firstKey;
    }
  }

  callBtn.addEventListener("click", function () {
    track("click_call", { clinic: key, click_location: "thank_you" });
  });
  waBtn.addEventListener("click", function () {
    track("click_whatsapp", { clinic: key, click_location: "thank_you" });
  });

  var cp = $("#ty-copy"); if (cp && CFG.copyright) cp.textContent = CFG.copyright;
});
</script>

</body>
</html>
